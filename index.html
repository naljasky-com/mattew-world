<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3e7cf">
<meta name="description" content="교회 초등부를 위한 마태복음 성경 탐험 게임">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="마태복음 탐험">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0}</style>
<title>마태복음 탐험 월드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: world map screen (scrolling parchment map, Matthew 1→28 from bottom to top) and a play screen (header + arena) for each stage's mini-game. Single storybook look. */
:root {
  --night: #1b1f4a;
  --ink: #241c3b;
  --ink-soft: #3a3058;
  --parch: #fff6e0;
  --parch-2: #f1dfb4;
  --map: #efe0bb;
  --gold: #f2b632;
  --gold-deep: #b97c0c;
  --leaf: #3f8f55;
  --text-dark: #2b2140;
  --ok: #2f8a4a;
  --bad: #c0392b;
  --f-display: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: #f3e7cf; color: var(--parch); font-family: var(--f-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.hud {
  flex: none; display: flex; align-items: center; gap: 8px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(251,243,225,.97); border-bottom: 2px solid #d9c39b; color: #3b2f2a; z-index: 2;
}
.hud-title { flex: 1 1 auto; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: none; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1; padding: 9px 12px; border-radius: 999px; background: #efe0bf; color: #8a5a10; font-variant-numeric: tabular-nums; }
.icon-btn { flex: none; min-width: 42px; height: 36px; padding: 0 10px; border: 2px solid #c9ad80; border-radius: 10px; background: #fbf3e1; color: #3b2f2a; font-family: var(--f-display); font-weight: 700; font-size: 15px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Map */
.mapscroll { flex: 1 1 auto; min-height: 0; overflow: hidden; background: #f3e7cf; }
.mapwrap { position: relative; width: 100%; height: 100%; }
.mapwrap svg { display: block; width: 100%; height: 100%; }
.node .glow { animation: glow 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes glow { 50% { transform: scale(1.18); opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .node .glow { animation: none; } }
.node { cursor: pointer; }
.node:focus-visible circle.ring { stroke: var(--gold); stroke-width: 6; }
#avatar { position: absolute; width: 46px; height: 60px; pointer-events: none; transition: left .55s ease-in-out, top .55s ease-in-out; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
@media (prefers-reduced-motion: reduce) { #avatar { transition: none; } }

/* Bottom sheet for a stage */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  padding-top: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--parch); color: var(--text-dark); border-top: 3px solid #d9c39b;
  border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.25);
}
.sheet-in { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--ink); color: var(--parch); font-family: var(--f-display); font-weight: 700; font-size: 14px; }
.verse-s { font-family: var(--f-display); font-weight: 700; color: var(--gold-deep); font-size: 15px; }
.sheet p { margin: 0; font-size: 16px; line-height: 1.5; }
.stars-row { font-size: 22px; letter-spacing: 2px; color: var(--gold-deep); }

/* Play screen */
.arena { position: relative; flex: 1 1 auto; min-height: 0; background: #f3e7cf; overflow: hidden; }
.arena canvas.full { display: block; width: 100%; height: 100%; touch-action: none; }
.pad {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.pad .grp { display: flex; gap: 10px; pointer-events: auto; }
.pbtn {
  width: 68px; height: 64px; border-radius: 20px; border: 2px solid #c9ad80; background: rgba(251,243,225,.9); box-shadow: 0 4px 0 rgba(138,106,74,.3);
  color: #3b2f2a; font-family: var(--f-display); font-weight: 700; font-size: 26px; touch-action: none; cursor: pointer;
}
.pbtn.gold { width: 104px; background: #e9b44c; border-color: #b8862a; box-shadow: 0 4px 0 #b8862a; color: var(--text-dark); font-size: 21px; }
.pbtn.on { transform: translateY(2px) scale(.96); filter: brightness(1.2); }
.dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 56px); gap: 6px; pointer-events: auto; }
.dpad .pbtn { width: 60px; height: 56px; font-size: 22px; }

/* DOM mini-games share a parchment board */
.board {
  position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 0%, #fbf3e1, #f3e7cf 55%, #e6d2ad);
}
.board > * { width: 100%; max-width: 620px; }
.board .info { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-align: center; color: #3b2f2a; }
.board.dark .info { color: var(--parch); }
.board.dark .sub { color: #d9d1f0; }
.board .sub { font-size: 15px; text-align: center; color: #5b4a3a; line-height: 1.5; min-height: 22px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.slot { min-width: 64px; padding: 8px 8px; border-radius: 12px; border: 2px dashed #c9ad80; font-family: var(--f-display); font-weight: 700; font-size: 15px; text-align: center; color: #b3a184; }
.slot.filled { border: 2px solid var(--gold); background: var(--gold); color: var(--text-dark); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  min-width: 92px; min-height: 54px; padding: 8px 12px; border-radius: 14px; border: 3px solid #e3cf9c; background: var(--parch);
  color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 19px; cursor: pointer; box-shadow: 0 4px 0 #c9b27a;
}
.tile.used { visibility: hidden; }
.tile.shake { animation: shake .35s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.card-m {
  aspect-ratio: 3 / 4; max-width: 100%; border: 0; border-radius: 14px; background: #8faa6c; color: var(--text-dark); cursor: pointer;
  box-shadow: 0 4px 0 #66804c; font-family: var(--f-display); font-weight: 700; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  transition: transform .2s;
}
.card-m .em { font-size: 34px; line-height: 1; }
.card-m.back::after { content: "✝"; font-size: 30px; color: rgba(255,246,224,.6); }
.card-m.back > * { display: none; }
.card-m.open { background: var(--parch); transform: rotateY(0); }
.card-m.done { background: #dff3e3; box-shadow: 0 4px 0 #8fc49c; }
.card-m.dark.back { background: #1d1a3a; box-shadow: 0 4px 0 #0b0a1c; }
.card-m.dark.back::after { content: "?"; color: rgba(255,214,90,.5); }
.card-m.dark.open, .card-m.dark.done { background: #fff3c4; box-shadow: 0 0 18px rgba(255,214,90,.8), 0 4px 0 #c9a23a; }
.bgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; aspect-ratio: 1; max-width: min(520px, 100%); }
.bt {
  position: relative; border-radius: 12px; background: var(--parch); color: var(--text-dark); display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 12px; line-height: 1.15; text-align: center; padding: 2px; box-shadow: 0 3px 0 #c9b27a;
}
.bt .ic { font-size: 22px; line-height: 1; }
.bt.start { background: #ffe39a; }
.bt.goal { background: #ffcf7a; }
.bt canvas { position: absolute; width: 34px; height: 44px; top: -16px; left: 50%; margin-left: -17px; pointer-events: none; }
.bcenter { grid-column: 2 / 5; grid-row: 2 / 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.dice { width: 72px; height: 72px; border-radius: 16px; background: #fff; color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 42px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #b9ad8f; }
.dice.roll { animation: roll .5s; }
@keyframes roll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
.bmsg { font-size: 14px; line-height: 1.4; color: #3b2f2a; min-height: 38px; }
.hearts { font-size: 24px; letter-spacing: 3px; text-align: center; }

/* Overlays */
.overlay {
  position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(14, 12, 38, .66);
}
.card {
  width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; padding: 22px 20px; border-radius: 22px;
  background: var(--parch); color: var(--text-dark); border: 3px solid #d9c39b; box-shadow: 0 6px 0 rgba(138,106,74,.35);
  display: flex; flex-direction: column; gap: 14px;
}
.card.wide { max-width: 640px; }
.card h1, .card h2 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; }
.card h1 { font-size: 30px; line-height: 1.15; }
.card h2 { font-size: 24px; line-height: 1.25; }
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--gold-deep); letter-spacing: .08em; }
.card p { margin: 0; font-size: 16px; line-height: 1.55; }
.howbox { padding: 12px 14px; border-radius: 14px; background: var(--parch-2); font-size: 16px; line-height: 1.5; }
.howbox b { font-family: var(--f-display); font-weight: 700; color: var(--leaf); }
.diffs { display: flex; flex-direction: column; gap: 10px; }
.diff-btn { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 12px 16px; border: 0; border-radius: 16px; color: #fff; text-align: left; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.22); }
.diff-btn .d-name { font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.diff-btn .d-grade { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.diff-btn .d-desc { grid-column: 1 / -1; font-size: 14px; }
.diff-btn[data-d="easy"] { background: #3f9a57; }
.diff-btn[data-d="normal"] { background: #3b6fd1; }
.diff-btn[data-d="hard"] { background: #c8553d; }
.diff-btn[aria-pressed="true"] { outline: 4px solid var(--text-dark); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; line-height: 1.4; }
.check input { width: 22px; height: 22px; accent-color: var(--gold-deep); }
.note { font-size: 13px; color: #6d5f86; line-height: 1.5; }
.q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.q-gate { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--gold-deep); }
.q-timer { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--bad); font-variant-numeric: tabular-nums; }
.q-text { font-family: var(--f-display); font-weight: 700; font-size: 23px; line-height: 1.35; }
.opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
.opts.ox { grid-template-columns: 1fr 1fr; }
.opt { min-height: 54px; padding: 10px 14px; border-radius: 14px; border: 3px solid #e3cf9c; background: #fff; color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.3; text-align: left; cursor: pointer; }
.opts.ox .opt { min-height: 84px; font-size: 22px; text-align: center; }
.opt:disabled { cursor: default; }
.opt.right { background: #dff3e3; border-color: var(--ok); }
.opt.wrong { background: #f9e0dc; border-color: var(--bad); }
.feedback { padding: 12px 14px; border-radius: 14px; font-size: 16px; line-height: 1.5; }
.feedback.ok { background: #e3f4e7; color: #1f5e31; }
.feedback.no { background: #fbe7e3; color: #7c241a; }
.feedback b { font-family: var(--f-display); font-weight: 700; font-size: 19px; display: block; margin-bottom: 2px; }
.main-btn { min-height: 52px; border: 0; border-radius: 16px; background: #e9b44c; color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 20px; cursor: pointer; box-shadow: 0 5px 0 #b8862a; }
.main-btn:disabled { opacity: .55; cursor: default; }
.sub-btn { min-height: 48px; border: 3px solid #e3cf9c; border-radius: 16px; background: #fff; color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 18px; cursor: pointer; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row > * { flex: 1 1 150px; }
.big-stars { font-size: 48px; text-align: center; letter-spacing: 6px; color: var(--gold-deep); }
.big-stars span { display: inline-block; animation: pop .5s both; }
.big-stars span.off { color: #d8ccb0; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.verse { padding: 14px; border-radius: 14px; background: var(--parch-2); font-size: 17px; line-height: 1.55; text-align: center; }
.verse strong { font-family: var(--f-display); font-weight: 700; font-size: 24px; display: block; }
.dress-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.preview { flex: none; width: 140px; height: 184px; margin-inline: auto; border-radius: 18px; background: linear-gradient(#cfe8f5, #f6ead0); }
.dress-opts { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.field-title { display: block; font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--gold-deep); margin-bottom: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #e3cf9c; cursor: pointer; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--text-dark); }
.chipbtn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 3px solid #e3cf9c; background: #fff; color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 16px; cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--text-dark); border-color: var(--text-dark); color: var(--parch); }
.face-box { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: var(--parch-2); }
.face-editor { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
#faceCv { flex: none; width: 220px; height: 220px; margin-inline: auto; border-radius: 16px; background: #2b2140; touch-action: none; cursor: grab; }
.face-side { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.face-row { display: flex; align-items: center; gap: 12px; }
#faceOut { flex: none; width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--gold); background: #fff; }
#faceZoom { width: 100%; accent-color: var(--gold-deep); }
.face-box .note { margin: 0; }
.name-in { box-sizing: border-box; width: 100%; min-height: 46px; padding: 0 14px; border-radius: 14px; border: 3px solid #e3cf9c; background: #fff; color: var(--text-dark); font-family: var(--f-display); font-weight: 700; font-size: 19px; -webkit-user-select: text; user-select: text; }
.toast {
  position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 40; width: max-content; max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 14px; background: rgba(36,28,59,.94); color: var(--parch); font-size: 15px; line-height: 1.4; text-align: center; pointer-events: none;
}
/* Matthew storyteller */
.story-ov { padding: 0; background: #f3e7cf; align-items: stretch; }
.scene { position: absolute; inset: 0; }
.scene svg { display: block; width: 100%; height: 100%; }
.story { position: relative; width: 100%; max-width: 600px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.story-row { margin-top: auto; }
.story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.story .eyebrow { color: #6b4a1a; background: rgba(251,243,225,.88); padding: 7px 12px; border-radius: 999px; }
.skip { border: 0; background: rgba(251,243,225,.88); border-radius: 10px; color: #3b2f2a; font-family: var(--f-display); font-weight: 700; font-size: 15px; cursor: pointer; padding: 8px 12px; }
.story-row { display: flex; align-items: flex-end; gap: 10px; }
.matt { flex: none; width: 104px; height: 130px; }
.bubble { position: relative; flex: 1 1 auto; min-width: 0; min-height: 120px; padding: 14px 16px; border-radius: 18px; background: var(--parch); border: 2px solid #d9c39b; box-shadow: 0 4px 0 rgba(138,106,74,.25); color: var(--text-dark); display: flex; flex-direction: column; gap: 6px; }
.bubble::before { content: ""; position: absolute; left: -10px; bottom: 26px; border: 10px solid transparent; border-right-color: var(--parch); border-left: 0; }
.bubble .who { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--leaf); }
.bubble p { margin: 0; font-size: 18px; line-height: 1.55; }
.bubble .count { margin-top: auto; align-self: flex-end; font-size: 13px; color: #8c7a52; font-variant-numeric: tabular-nums; }
.bubble.pop { animation: bub .25s ease-out; }
@keyframes bub { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (max-width: 420px) { .matt { width: 84px; height: 106px; } .bubble p { font-size: 17px; } }
.matt-say { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--parch-2); }
.matt.sm { width: 54px; height: 68px; }
.matt-say p { font-size: 15px; line-height: 1.5; }
.matt-say b { display: block; font-family: var(--f-display); font-weight: 700; color: var(--leaf); }
/* gate question inside the wilderness maze */
.gate-card { max-width: 480px; }
.gate-say { padding: 10px 12px; border-radius: 14px; background: #e9e6f3; color: #3a3058; font-size: 16px; line-height: 1.5; }
.gate-say b { font-family: var(--f-display); font-weight: 700; }
.ic { display: inline-flex; vertical-align: middle; }
.ic svg { width: 26px; height: 26px; }
.card-m .em svg { width: 42px; height: 42px; }
@media (min-width: 700px) and (min-height: 700px) { .board > .cards { max-width: 560px !important; } .card-m .em svg { width: 56px; height: 56px; } .bgrid { max-width: min(640px, 100%); } .bt .ic svg { width: 36px; height: 36px; } .bt { font-size: 14px; } .card { max-width: 600px; } }
.bt .ic svg { width: 28px; height: 28px; }
.ox-ic svg { width: 30px; height: 30px; }
.inl svg { width: 20px; height: 20px; }
.hearts .ic svg { width: 30px; height: 30px; }
.dice { background: none !important; box-shadow: none !important; }
.dice svg { width: 72px; height: 72px; filter: drop-shadow(0 4px 0 rgba(138,106,74,.35)); }
.credit { position: absolute; right: 12px; bottom: 8px; font-family: var(--f-body); font-size: 11px; letter-spacing: .04em; color: #8a7558; pointer-events: none; }
@media (max-width: 440px) { .hud-title { font-size: 16px; } #mapTitle.big { display: none; } #mapScreen .chip { margin-right: auto; } }
.bt { border: 1.5px solid #e3cf9c; }
@media (max-height: 520px) {
  .card { padding: 16px; gap: 10px; }
  .card h1 { font-size: 24px; }
  .pbtn { height: 54px; width: 60px; }
  .pbtn.gold { width: 92px; }
  .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 46px); }
  .dpad .pbtn { width: 52px; height: 46px; }
  .bgrid { max-width: min(330px, 100%); }
  .cards { grid-template-columns: repeat(6, 1fr); }
  .board > .cards { max-width: 560px !important; }
}
</style>
</head>
<body>


<div id="app">
  <!-- ============ 지도 화면 ============ -->
  <section class="screen" id="mapScreen">
    <header class="hud">
      <button class="icon-btn" id="mapBack" type="button" hidden>← 큰 지도</button>
      <div class="hud-title" id="mapTitle">마태복음 탐험 월드</div>
      <div class="chip" id="totalStars" aria-label="모은 별">⭐ 0</div>
      <button class="icon-btn" id="dressBtn" type="button">꾸미기</button>
      <button class="icon-btn" id="setBtn" type="button">설정</button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="소리 끄기">소리 켬</button>
    </header>
    <div class="mapscroll" id="mapScroll">
      <div class="mapwrap" id="mapWrap">
        <svg id="mapSvg" viewBox="0 0 360 2780" role="img" aria-label="마태복음 전체 지도"></svg>
        <canvas id="avatar" width="92" height="120" aria-hidden="true"></canvas>
        <div class="credit" id="credit">made by naljasky</div>
      </div>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-in">
        <div class="sheet-head">
          <span class="verse-s" id="shVerse"></span>
          <span class="tag" id="shGame"></span>
        </div>
        <h2 id="shTitle"></h2>
        <p id="shLine"></p>
        <div class="stars-row" id="shStars"></div>
        <div class="btn-row">
          <button class="sub-btn" type="button" id="shClose">닫기</button>
          <button class="main-btn" type="button" id="shGo">출발!</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 플레이 화면 ============ -->
  <section class="screen" id="playScreen" hidden>
    <header class="hud">
      <button class="icon-btn" id="backBtn" type="button">← 지도</button>
      <div class="hud-title" id="playTitle"></div>
      <div class="chip" id="playScore"></div>
    </header>
    <div class="arena" id="arena"></div>
  </section>

  <!-- ============ 오버레이 ============ -->
  <div class="overlay story-ov" id="storyOv" hidden>
    <div class="scene" id="storyBg" aria-hidden="true"></div>
    <div class="story" role="dialog" aria-labelledby="stText">
      <div class="story-top"><span class="eyebrow" id="stEyebrow"></span><button type="button" class="skip" id="stSkip">건너뛰기</button></div>
      <div class="story-row">
      <svg class="matt" viewBox="0 0 120 152" aria-hidden="true">
        <ellipse cx="60" cy="148" rx="40" ry="4" fill="rgba(90,60,30,.2)"/>
        <path d="M 20 150 Q 22 96 60 90 Q 98 96 100 150 Z" fill="#5f8f8c" stroke="#466b69" stroke-width="1.2"/>
        <path d="M 46 94 L 60 116 L 74 94 Z" fill="#f4e6c6"/>
        <rect x="53" y="78" width="14" height="14" fill="#e6b994"/>
        <circle cx="60" cy="58" r="24" fill="#f3cfae" stroke="#c99b78" stroke-width="1"/>
        <path d="M 37 60 Q 38 94 60 94 Q 82 94 83 60 Q 78 76 60 76 Q 42 76 37 60 Z" fill="#7a5233"/>
        <path d="M 53 79 Q 60 83 67 79" stroke="#f6dcc6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M 46 56 Q 51 53 55 56 M 65 56 Q 69 53 74 56" stroke="#3b2f2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <circle cx="45" cy="66" r="4.5" fill="#f2a7a0" opacity=".6"/><circle cx="75" cy="66" r="4.5" fill="#f2a7a0" opacity=".6"/>
        <path d="M 34 56 Q 32 28 60 28 Q 88 28 86 56 Q 74 44 60 44 Q 46 44 34 56 Z" fill="#f4e6c6" stroke="#c9ad80" stroke-width="1.2"/>
        <path d="M 36 48 Q 60 36 84 48" stroke="#d99a3b" stroke-width="3" fill="none"/>
        <g transform="rotate(-14 86 120)"><rect x="64" y="108" width="44" height="24" rx="4" fill="#fbf3e1" stroke="#b8945f" stroke-width="1.6"/><path d="M 72 116 H 100 M 72 122 H 94" stroke="#cdb48a" stroke-width="2"/><circle cx="64" cy="120" r="6" fill="#e8d4a8" stroke="#b8945f" stroke-width="1.6"/><circle cx="108" cy="120" r="6" fill="#e8d4a8" stroke="#b8945f" stroke-width="1.6"/></g>
        <circle cx="70" cy="124" r="7" fill="#f3cfae"/>
      </svg>
        <div class="bubble" id="stBubble"><div class="who">마태</div><p id="stText" aria-live="polite"></p><div class="count" id="stCount"></div></div>
      </div>
      <div class="btn-row">
        <button type="button" class="sub-btn" id="stBack" hidden>◀ 앞으로</button>
        <button type="button" class="main-btn" id="stNext">다음 ▶</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="introOv" hidden>
    <div class="card" role="dialog" aria-labelledby="inTitle">
      <div class="eyebrow" id="inEyebrow"></div>
      <h1 id="inTitle"></h1>
      <p id="inLine"></p>
      <div class="howbox"><b id="inGame"></b> · <span id="inHow"></span></div>
      <button class="main-btn" type="button" id="inGo">시작하기</button>
    </div>
  </div>

  <div class="overlay" id="quizOv" hidden>
    <div class="card" role="dialog" aria-labelledby="qText">
      <div class="q-head"><div class="q-gate" id="qGate"></div><div class="q-timer" id="qTimer" hidden></div></div>
      <div class="q-text" id="qText"></div>
      <div class="opts" id="qOpts"></div>
      <div class="feedback" id="qFeedback" hidden></div>
      <button type="button" class="main-btn" id="qAction" hidden></button>
    </div>
  </div>

  <div class="overlay" id="resultOv" hidden>
    <div class="card" role="dialog" aria-labelledby="rTitle">
      <div class="eyebrow" id="rEyebrow"></div>
      <h1 id="rTitle">단계 완료!</h1>
      <div class="big-stars" id="rStars"></div>
      <p id="rNote"></p>
      <div class="matt-say" id="rMattBox" hidden><svg class="matt sm" viewBox="0 0 120 152" aria-hidden="true">
        <ellipse cx="60" cy="148" rx="40" ry="4" fill="rgba(90,60,30,.2)"/>
        <path d="M 20 150 Q 22 96 60 90 Q 98 96 100 150 Z" fill="#5f8f8c" stroke="#466b69" stroke-width="1.2"/>
        <path d="M 46 94 L 60 116 L 74 94 Z" fill="#f4e6c6"/>
        <rect x="53" y="78" width="14" height="14" fill="#e6b994"/>
        <circle cx="60" cy="58" r="24" fill="#f3cfae" stroke="#c99b78" stroke-width="1"/>
        <path d="M 37 60 Q 38 94 60 94 Q 82 94 83 60 Q 78 76 60 76 Q 42 76 37 60 Z" fill="#7a5233"/>
        <path d="M 53 79 Q 60 83 67 79" stroke="#f6dcc6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M 46 56 Q 51 53 55 56 M 65 56 Q 69 53 74 56" stroke="#3b2f2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <circle cx="45" cy="66" r="4.5" fill="#f2a7a0" opacity=".6"/><circle cx="75" cy="66" r="4.5" fill="#f2a7a0" opacity=".6"/>
        <path d="M 34 56 Q 32 28 60 28 Q 88 28 86 56 Q 74 44 60 44 Q 46 44 34 56 Z" fill="#f4e6c6" stroke="#c9ad80" stroke-width="1.2"/>
        <path d="M 36 48 Q 60 36 84 48" stroke="#d99a3b" stroke-width="3" fill="none"/>
        <g transform="rotate(-14 86 120)"><rect x="64" y="108" width="44" height="24" rx="4" fill="#fbf3e1" stroke="#b8945f" stroke-width="1.6"/><path d="M 72 116 H 100 M 72 122 H 94" stroke="#cdb48a" stroke-width="2"/><circle cx="64" cy="120" r="6" fill="#e8d4a8" stroke="#b8945f" stroke-width="1.6"/><circle cx="108" cy="120" r="6" fill="#e8d4a8" stroke="#b8945f" stroke-width="1.6"/></g>
        <circle cx="70" cy="124" r="7" fill="#f3cfae"/>
      </svg><p><b>마태의 한마디</b><span id="rMatt"></span></p></div>
      <div class="btn-row">
        <button class="sub-btn" type="button" id="rAgain">다시 하기</button>
        <button class="main-btn" type="button" id="rMap">지도로 가기</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="landOv" hidden>
    <div class="card" role="dialog" aria-labelledby="lTitle">
      <div class="eyebrow" id="lEyebrow">첫 번째 이야기 완료</div>
      <h1 id="lTitle"></h1>
      <div class="verse"><strong id="lKey"></strong><span id="lVerse"></span></div>
      <p id="lNext"></p>
      <button class="main-btn" type="button" id="lOk">지도로 가기</button>
    </div>
  </div>

  <div class="overlay" id="setOv" hidden>
    <div class="card" role="dialog" aria-labelledby="sTitle">
      <h2 id="sTitle">설정</h2>
      <div class="eyebrow">난이도</div>
      <div class="diffs" id="diffs"></div>
      <label class="check"><input type="checkbox" id="unlockAll"> 모든 단계 열어 보기 (선생님 미리보기용)</label>
      <div class="btn-row">
        <button class="sub-btn" type="button" id="resetBtn">진행 기록 지우기</button>
        <button class="main-btn" type="button" id="setDone">닫기</button>
      </div>
      <p class="note" id="resetNote">진행 기록은 이 기기의 브라우저에만 저장돼요.</p>
    </div>
  </div>

  <div class="overlay" id="dressOv" hidden>
    <div class="card wide" role="dialog" aria-labelledby="dressTitle">
      <h2 id="dressTitle">내 캐릭터 꾸미기</h2>
      <div class="dress-grid">
        <canvas class="preview" id="bigPv" aria-label="꾸민 캐릭터 미리 보기"></canvas>
        <div class="dress-opts">
          <div>
            <label class="field-title" for="nameIn">이름 (8글자까지)</label>
            <input class="name-in" id="nameIn" type="text" maxlength="8" placeholder="예: 루야" autocomplete="off">
          </div>
          <div class="face-box">
            <div class="field-title" style="margin:0">내 얼굴 사진 (선택)</div>
            <div class="btn-row">
              <button type="button" class="sub-btn" id="faceCam">셀카 찍기</button>
              <button type="button" class="sub-btn" id="faceAlbum">앨범에서 고르기</button>
              <button type="button" class="sub-btn" id="faceClear" hidden>사진 지우기</button>
            </div>
            <input type="file" id="faceFileCam" accept="image/*" capture="user" hidden>
            <input type="file" id="faceFileAlbum" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif" hidden>
            <div class="face-editor" id="faceEditor" hidden>
              <canvas id="faceCv" aria-label="얼굴 위치 맞추기"></canvas>
              <div class="face-side">
                <p class="note">손가락으로 사진을 옮기고, 두 손가락이나 아래 막대로 크기를 맞춰요. 얼굴을 동그라미 안에 넣어 주세요.</p>
                <label class="field-title" for="faceZoom" style="margin:0">크기</label>
                <input type="range" id="faceZoom" min="1" max="4" step="0.01" value="1.4">
                <div class="field-title" style="margin:0">필터</div>
                <div class="swatches" id="faceFilters"></div>
                <div class="face-row">
                  <canvas id="faceOut" width="128" height="128" aria-label="얼굴 미리 보기"></canvas>
                  <button type="button" class="main-btn" id="faceApply" style="flex:1 1 auto">이 얼굴로 저장</button>
                </div>
              </div>
            </div>
            <p class="note">사진은 이 기기 안에만 저장되고 어디에도 보내지 않아요.</p>
          </div>
          <div id="dressOpts" class="dress-opts" style="flex:none"></div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="sub-btn" id="dRandom">아무거나 골라 줘요</button>
        <button type="button" class="main-btn" id="dDone">다 꾸몄어요</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. 데이터 — 새 땅이나 스테이지는 여기서 추가합니다
   ===================================================================== */
const OX = ['⭕ 맞아요', '❌ 아니에요'];
const QUIZ = [
  { title: '족보의 계단', verse: '마 1:1-17',
    easy: [
      { q: '예수님의 족보에는 다윗 왕의 이름이 나와요.', o: OX, a: 1, h: '방금 올라온 계단 맨 위에 누구 이름이 있었나요?', e: '예수님은 다윗의 자손으로 오셨어요. (마 1:1)' },
      { q: '마태복음 1장은 예수님의 족보(가족 이야기)로 시작해요.', o: OX, a: 1, h: '계단에 적힌 이름들이 바로 족보예요.', e: '아브라함부터 예수님까지 이어지는 족보로 시작해요. (마 1:1-16)' } ],
    normal: [
      { q: '마태복음 족보는 누구부터 시작할까요?', o: ['아브라함', '노아', '모세'], a: 1, h: '계단 첫 번째 칸의 이름을 떠올려 보세요.', e: '족보는 아브라함부터 시작해요. (마 1:2)' },
      { q: '예수님은 어떤 왕의 자손으로 불리셨나요?', o: ['사울 왕', '다윗 왕', '헤롯 왕'], a: 2, h: '골리앗을 이긴 소년이 나중에 왕이 되었어요.', e: "예수님은 '다윗의 자손'으로 불리셨어요. (마 1:1)" } ],
    hard: [
      { q: '아브라함부터 다윗까지는 모두 몇 대일까요?', o: ['7대', '12대', '14대', '40대'], a: 3, h: '방금 올라온 계단 수를 세어 보세요!', e: '아브라함부터 다윗까지 열네 대예요. (마 1:17)' },
      { q: '족보에서 요셉은 누구의 남편으로 소개되나요?', o: ['사라', '룻', '라헬', '마리아'], a: 4, h: '예수님의 어머니 이름이에요.', e: '요셉은 마리아의 남편으로 소개돼요. (마 1:16)' } ] },
  { title: '요셉의 꿈', verse: '마 1:18-25',
    easy: [
      { q: '주의 사자(천사)가 요셉의 꿈에 나타났어요.', o: OX, a: 1, h: "구름 위를 건너며 '꿈' 이야기를 떠올려 보세요.", e: '주의 사자가 요셉의 꿈에 나타나 말씀을 전했어요. (마 1:20)' },
      { q: "천사는 아기 이름을 '모세'라고 지으라고 했어요.", o: OX, a: 2, h: '우리를 구원하시는 분의 이름이에요.', e: "아기 이름은 '예수'예요. (마 1:21)" } ],
    normal: [
      { q: '천사가 아기의 이름을 무엇이라 하라고 했나요?', o: ['요한', '예수', '다윗'], a: 2, h: '우리가 기도를 마칠 때 부르는 이름이에요.', e: "아기 이름을 '예수'라 하라고 했어요. (마 1:21)" },
      { q: "'임마누엘'은 무슨 뜻일까요?", o: ['하나님이 우리와 함께 계시다', '하나님은 크시다', '평화의 왕'], a: 1, h: '하나님이 늘 곁에 계신다는 뜻이에요.', e: "임마누엘은 '하나님이 우리와 함께 계시다'는 뜻이에요. (마 1:23)" } ],
    hard: [
      { q: "천사가 아기 이름을 '예수'라 하라고 한 이유는?", o: ['큰 나라의 왕이 될 것이므로', '자기 백성을 죄에서 구원할 분이므로', '훌륭한 선생님이 될 것이므로', '제사장이 될 것이므로'], a: 2, h: "'예수'라는 이름에는 '구원'이라는 뜻이 담겨 있어요.", e: '예수님은 자기 백성을 죄에서 구원하실 분이에요. (마 1:21)' },
      { q: '요셉은 잠에서 깬 뒤 어떻게 했나요?', o: ['천사의 말대로 마리아를 아내로 맞이했다', '마리아를 조용히 떠나보냈다', '예루살렘으로 이사했다', '제사장에게 물어보러 갔다'], a: 1, h: '요셉은 하나님 말씀에 순종하는 사람이었어요.', e: '요셉은 천사의 말대로 마리아를 아내로 맞이했어요. (마 1:24)' } ] },
  { title: '동방박사의 별길', verse: '마 2:1-2',
    easy: [
      { q: '동방박사들은 별을 보고 아기 예수님께 경배하러 왔어요.', o: OX, a: 1, h: '방금 따라온 길 위에 무엇이 빛나고 있었나요?', e: '동방박사들은 별을 보고 경배하러 왔어요. (마 2:2)' },
      { q: '예수님은 큰 도시 로마에서 태어나셨어요.', o: OX, a: 2, h: "'다윗의 동네'라고도 불리는 작은 마을이에요.", e: '예수님은 유대 베들레헴에서 나셨어요. (마 2:1)' } ],
    normal: [
      { q: '예수님이 태어나신 곳은 어디일까요?', o: ['나사렛', '베들레헴', '로마'], a: 2, h: "'다윗의 동네'라고도 불리는 작은 마을이에요.", e: '예수님은 유대 베들레헴에서 나셨어요. (마 2:1)' },
      { q: '동방박사들은 무엇을 따라왔나요?', o: ['구름', '무지개', '별'], a: 3, h: '밤하늘에 반짝이는 것이에요.', e: '동방박사들은 별을 보고 왔어요. (마 2:2)' } ],
    hard: [

/* --- 캔버스 미니게임 공통 루프 --- */
function canvasGame(root, init) {
  const cnv = h('canvas', 'full'); root.appendChild(cnv);
  const pad = h('div', 'pad'); root.appendChild(pad);
  const c = cnv.getContext('2d');
  let raf = 0, last = performance.now(), alive = true, pat = null;
  const api = init({ cnv, c, pad });
  const loop = (now) => {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const fit = fitCanvas(cnv);
    c.setTransform(fit.d, 0, 0, fit.d, 0, 0);
    api.frame(dt, fit.w, fit.h);
    c.setTransform(fit.d, 0, 0, fit.d, 0, 0); c.globalAlpha = 1; c.fillStyle = pat || (pat = paperPattern(c)); c.fillRect(0, 0, fit.w, fit.h);
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame((t) => { last = t; loop(t); });
  const onKey = (e) => api.key && api.key(e);
  window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKey);
  return { stop() { alive = false; cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey); api.stop && api.stop(); } };
}

  return SCENE_IMG[key];
}
function drawScene(c, kind, far, w, h) {

            if (g.rest > 0) { g.rest--; continue; }
            if (g.i + g.dir < 0 || g.i + g.dir >= g.r.length) g.dir *= -1;
            g.i += g.dir;
            if (Z.dwell && (g.i === 0 || g.i === g.r.length - 1)) g.rest = 1;
          }
          check();
        }
      }
      drawScene(c, WILD ? 'wild' : 'dusk', true, w, hgt);
      let cell, ox, oy = 8;
      if (w > hgt * 1.1) {
        const leftW = 220;
        cell = Math.floor(Math.min((w - leftW - 24) / COLS, (hgt - 16) / ROWS));
        ox = Math.floor(leftW + (w - leftW - cell * COLS) / 2);
      } else {
        cell = Math.floor(Math.min((w - 8) / COLS, (hgt - 150) / ROWS));
        ox = Math.floor((w - cell * COLS) / 2);
      }
      // 양피지 판
      c.fillStyle = 'rgba(251,243,225,.92)'; rr(c, ox - 6, oy - 6, cell * COLS + 12, cell * ROWS + 12, 14); c.fill();
      c.strokeStyle = '#b8945f'; c.lineWidth = 2; c.stroke();
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const X = ox + x * cell, Y = oy + y * cell;
        if (wall(x, y)) {
          const v = ((x * 7 + y * 13) % 5) * 3;
          c.fillStyle = WILD ? `rgb(${190 + v},${150 + v},${98 + v})` : `rgb(${200 + v},${178 + v},${138 + v})`;
          rr(c, X + 1, Y + 1, cell - 2, cell - 2, cell * 0.18); c.fill();
          c.strokeStyle = WILD ? '#8a6a44' : '#9b7b58'; c.lineWidth = 1.2; c.stroke();
          c.fillStyle = WILD ? 'rgba(232,200,140,.8)' : 'rgba(236,222,190,.85)'; rr(c, X + 4, Y + 3, cell - 8, cell * 0.22, cell * 0.1); c.fill();
        } else { c.fillStyle = WILD ? ((x + y) % 2 ? '#f1ddb0' : '#f5e5bf') : ((x + y) % 2 ? '#f6ead2' : '#fbf3e1'); c.fillRect(X, Y, cell, cell); }
        const L = gateAt(x, y);
        if (L && !opened.has(L)) {
          c.fillStyle = 'rgba(255,214,90,' + (0.5 + 0.25 * Math.sin(T * 3)) + ')'; rr(c, X + 2, Y + 2, cell - 4, cell - 4, 8); c.fill();
          c.fillStyle = '#fff6e0'; rr(c, X + cell * 0.18, Y + cell * 0.3, cell * 0.64, cell * 0.4, 4); c.fill();
          c.strokeStyle = '#b97c0c'; c.lineWidth = 2; c.stroke();
          label(c, '말씀', X + cell / 2, Y + cell * 0.6, Math.max(11, cell * 0.24), '#7a4b00');
        }
      }
      const ex = ox + exit[0] * cell, ey = oy + exit[1] * cell;
      c.fillStyle = 'rgba(255,207,74,' + (0.55 + 0.3 * Math.sin(T * 3)) + ')'; rr(c, ex + 3, ey + 3, cell - 6, cell - 6, 8); c.fill();
      label(c, Z.exit, ex + cell / 2, ey + cell / 2 + 6, Math.max(11, cell * (Z.exit.length > 2 ? 0.24 : 0.32)), '#7a4b00');
      for (const s of stars) if (!s.got) { starPath(c, ox + (s.x + 0.5) * cell, oy + (s.y + 0.5) * cell, cell * 0.32, cell * 0.14); c.fillStyle = '#f2c94c'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#b8862a'; c.stroke(); }
      for (const g of guards) {
        const [gx, gy] = g.r[g.i], X = ox + gx * cell, Y = oy + gy * cell, k = cell / 60;
        if (WILD) { drawShadow(X, Y, cell); continue; }
        c.fillStyle = 'rgba(200,90,70,.14)'; c.fillRect(X, Y, cell, cell);
        c.strokeStyle = '#6b4a32'; c.lineWidth = 1.4 * k;
        c.fillStyle = '#b8574a'; rr(c, X + 16 * k, Y + 24 * k, 28 * k, 26 * k, 6 * k); c.fill(); c.stroke();
        c.fillStyle = '#f3cfae'; c.beginPath(); c.arc(X + 30 * k, Y + 18 * k, 9 * k, 0, 7); c.fill(); c.stroke();
        c.fillStyle = 'rgba(242,167,160,.7)'; c.beginPath(); c.arc(X + 25 * k, Y + 21 * k, 2 * k, 0, 7); c.arc(X + 35 * k, Y + 21 * k, 2 * k, 0, 7); c.fill();
        c.fillStyle = '#a8a59a'; c.beginPath(); c.arc(X + 30 * k, Y + 15 * k, 10 * k, Math.PI, 0); c.fill(); c.stroke();
        c.strokeStyle = '#6b4a2b'; c.lineWidth = 3 * k; c.beginPath(); c.moveTo(X + 48 * k, Y + 54 * k); c.lineTo(X + 48 * k, Y + 6 * k); c.stroke();
      }
      if (!(inv > 0 && Math.floor(inv * 10) % 2 === 0)) {
        const k = cell / 52;
        c.save(); c.translate(ox + P.x * cell + cell / 2 - 14 * k, oy + P.y * cell + cell - 46 * k); c.scale(k, k);
        drawHero(c, 0, 0, face, 0, look); c.restore();
      }
    },
  };
});

/* ----- 얼굴 사진 편집기 (사진은 기기 밖으로 나가지 않음) ----- */
const FACE_FILTERS = ['원본', '크레용 만화', '파스텔 귀요미'];
const FE = { img: null, zoom: 1.4, ox: 0, oy: 0, filter: 0, pts: new Map(), pinch: 0, raf: 0 };
const FCV = 220, FR = 88;   // 편집 창 크기와 얼굴 동그라미 반지름 (CSS px)
function openFile(input) { ensureAudio(); input.value = ''; input.click(); }
$('faceCam').addEventListener('click', () => openFile($('faceFileCam')));
$('faceAlbum').addEventListener('click', () => openFile($('faceFileAlbum')));
['faceFileCam', 'faceFileAlbum'].forEach((id) => $(id).addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    // 큰 사진은 줄여서 메모리를 아낌
    const k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv0 = document.createElement('canvas');
    cv0.width = Math.round(im.naturalWidth * k); cv0.height = Math.round(im.naturalHeight * k);
    cv0.getContext('2d').drawImage(im, 0, 0, cv0.width, cv0.height);
    URL.revokeObjectURL(url);
    FE.img = cv0; FE.zoom = 1.4; FE.ox = 0; FE.oy = 0; FE.filter = look.faceStyle || 0;
    $('faceZoom').value = FE.zoom;
    renderFaceFilters();
    $('faceEditor').hidden = false;
    drawFaceEditor();
    applyFace(true);
    setTimeout(() => $('faceEditor').scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('사진을 열지 못했어요. 다른 사진으로 해 볼까요?'); };
  im.src = url;
}));
function faceGeom() {
  const iw = FE.img.width, ih = FE.img.height;
  const s = (FCV / Math.min(iw, ih)) * FE.zoom;
  return { s, dx: FCV / 2 - (iw * s) / 2 + FE.ox, dy: FCV / 2 - (ih * s) / 2 + FE.oy, w: iw * s, h: ih * s };
}
function drawFaceEditor() {
  if (!FE.img) return;
  const cnv = $('faceCv'), d = Math.min(window.devicePixelRatio || 1, 2);
  if (cnv.width !== FCV * d) { cnv.width = FCV * d; cnv.height = FCV * d; }
  const c = cnv.getContext('2d');
  c.setTransform(d, 0, 0, d, 0, 0);
  c.fillStyle = '#2b2140'; c.fillRect(0, 0, FCV, FCV);
  const g = faceGeom();
  c.drawImage(FE.img, g.dx, g.dy, g.w, g.h);
  c.fillStyle = 'rgba(20,16,40,.6)';
  c.beginPath(); c.rect(0, 0, FCV, FCV); c.arc(FCV / 2, FCV / 2, FR, 0, Math.PI * 2, true); c.fill();
  c.strokeStyle = '#f2b632'; c.lineWidth = 3; c.beginPath(); c.arc(FCV / 2, FCV / 2, FR, 0, 7); c.stroke();
  renderFaceOut();
}
function scheduleFace() { if (!FE.raf) FE.raf = requestAnimationFrame(() => { FE.raf = 0; drawFaceEditor(); applyFace(true); }); }
// 편집하는 동안에도 캐릭터 얼굴에 바로 보이게 하고, 저장까지 해 둠
function applyFace(quiet) {
  if (!FE.img) return;
  renderFaceOut();
  try { look.face = $('faceOut').toDataURL('image/jpeg', 0.85); } catch (e) { return; }
  look.faceStyle = FE.filter;
  saveLook(); setFaceImage(look.face);
  $('faceClear').hidden = false;
  if (!quiet) { sfx.good(); toast(canSave ? '내 얼굴이 캐릭터에 들어갔어요!' : '얼굴이 들어갔어요. 다만 이 화면에서는 저장이 안 돼서, 다시 열면 처음 얼굴로 돌아가요.', 3200); }
}
function renderFaceOut() {
  const out = $('faceOut'), N = out.width, c = out.getContext('2d');
  const g = faceGeom(), k = N / (FR * 2), off = FCV / 2 - FR;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, N, N);
  c.setTransform(k, 0, 0, k, -off * k, -off * k);
  c.drawImage(FE.img, g.dx, g.dy, g.w, g.h);
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (FE.filter === 1) crayonFilter(c, N);
  else if (FE.filter === 2) pastelFilter(c, N);
}
function blush(c, N, alpha) {
  for (const cx of [0.3, 0.7]) {
    const g = c.createRadialGradient(N * cx, N * 0.64, 0, N * cx, N * 0.64, N * 0.12);
    g.addColorStop(0, 'rgba(255,120,150,' + alpha + ')'); g.addColorStop(1, 'rgba(255,120,150,0)');
    c.fillStyle = g; c.beginPath(); c.arc(N * cx, N * 0.64, N * 0.12, 0, 7); c.fill();
  }
}
// 크레용 만화: 색을 단순하게 + 굵은 외곽선 + 크레용 질감
function crayonFilter(c, N) {
  const id = c.getImageData(0, 0, N, N), px = id.data, L = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) L[i] = px[i * 4] * 0.3 + px[i * 4 + 1] * 0.59 + px[i * 4 + 2] * 0.11;
  const src = new Uint8ClampedArray(px);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, o = i * 4;
    let r = src[o], g = src[o + 1], b = src[o + 2];
    const a = (r + g + b) / 3;
    r = a + (r - a) * 1.4; g = a + (g - a) * 1.4; b = a + (b - a) * 1.4;
    const q = (v) => Math.round(Math.max(0, Math.min(255, v)) / 255 * 4) / 4 * 255;
    r = q(r); g = q(g); b = q(b);
    let edge = 0;
    if (x > 0 && y > 0 && x < N - 1 && y < N - 1) {
      const gx = -L[i - N - 1] - 2 * L[i - 1] - L[i + N - 1] + L[i - N + 1] + 2 * L[i + 1] + L[i + N + 1];
      const gy = -L[i - N - 1] - 2 * L[i - N] - L[i - N + 1] + L[i + N - 1] + 2 * L[i + N] + L[i + N + 1];
      edge = Math.hypot(gx, gy);
    }
    const n = ((x * 73856093) ^ (y * 19349663)) % 17 - 8;
    if (edge > 70) { r = 58; g = 42; b = 32; }
    px[o] = r + n; px[o + 1] = g + n; px[o + 2] = b + n;
  }
  c.putImageData(id, 0, 0);
  blush(c, N, 0.35);
}
// 파스텔 귀요미: 부드럽게 + 밝은 파스텔 색 + 볼터치 + 반짝이
function pastelFilter(c, N) {
  const id = c.getImageData(0, 0, N, N), px = id.data;
  for (let pass = 0; pass < 2; pass++) {
    const src = new Uint8ClampedArray(px);
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
      for (let ch = 0; ch < 3; ch++) {
        let sum = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) sum += src[((y + dy) * N + (x + dx)) * 4 + ch];
        px[(y * N + x) * 4 + ch] = sum / 9;
      }
    }
  }
  for (let i = 0; i < N * N; i++) {
    const o = i * 4, a = (px[o] + px[o + 1] + px[o + 2]) / 3;
    let r = a + (px[o] - a) * 0.85, g = a + (px[o + 1] - a) * 0.85, b = a + (px[o + 2] - a) * 0.85;
    px[o] = r * 0.78 + 255 * 0.24 + 8; px[o + 1] = g * 0.78 + 255 * 0.22; px[o + 2] = b * 0.78 + 255 * 0.24 + 6;
  }
  c.putImageData(id, 0, 0);
  const v = c.createRadialGradient(N / 2, N / 2, N * 0.32, N / 2, N / 2, N * 0.52);
  v.addColorStop(0, 'rgba(255,190,220,0)'); v.addColorStop(1, 'rgba(255,190,220,.75)');
  c.fillStyle = v; c.fillRect(0, 0, N, N);
  blush(c, N, 0.45);
  [[0.2, 0.18, 0.07], [0.82, 0.24, 0.05], [0.74, 0.1, 0.035]].forEach(([sx, sy, r]) => {
    starPath(c, N * sx, N * sy, N * r, N * r * 0.42); c.fillStyle = '#fffbe6'; c.fill();
  });
}
function renderFaceFilters() {
  const box = $('faceFilters'); box.textContent = '';
  FACE_FILTERS.forEach((nm, i) => {
    const b = h('button', 'chipbtn', nm); b.type = 'button'; b.setAttribute('aria-pressed', String(FE.filter === i));
    b.addEventListener('click', () => { FE.filter = i; renderFaceFilters(); scheduleFace(); });
    box.appendChild(b);
  });
}
$('faceZoom').addEventListener('input', (e) => { FE.zoom = +e.target.value; scheduleFace(); });
(function faceDrag() {
  const cnv = $('faceCv');
  const dist = () => { const p = [...FE.pts.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
  cnv.addEventListener('pointerdown', (e) => { e.preventDefault(); try { cnv.setPointerCapture(e.pointerId); } catch (_) {} FE.pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (FE.pts.size === 2) FE.pinch = dist(); });
  cnv.addEventListener('pointermove', (e) => {
    const prev = FE.pts.get(e.pointerId); if (!prev || !FE.img) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (FE.pts.size === 1) { FE.ox += cur.x - prev.x; FE.oy += cur.y - prev.y; }
    FE.pts.set(e.pointerId, cur);
    if (FE.pts.size === 2) {
      const dd = dist();
      if (FE.pinch) { FE.zoom = Math.max(1, Math.min(4, FE.zoom * dd / FE.pinch)); $('faceZoom').value = FE.zoom; }
      FE.pinch = dd;
    }
    scheduleFace();
  });
  const up = (e) => { FE.pts.delete(e.pointerId); FE.pinch = 0; };
  cnv.addEventListener('pointerup', up); cnv.addEventListener('pointercancel', up);
  cnv.addEventListener('wheel', (e) => { e.preventDefault(); FE.zoom = Math.max(1, Math.min(4, FE.zoom * (e.deltaY < 0 ? 1.08 : 0.92))); $('faceZoom').value = FE.zoom; scheduleFace(); }, { passive: false });
})();
$('faceApply').addEventListener('click', () => {
  applyFace(false);
  $('faceEditor').hidden = true; FE.img = null;
});
$('faceClear').addEventListener('click', () => {
  look.face = ''; look.faceStyle = 0; saveLook(); setFaceImage('');
  $('faceClear').hidden = true; $('faceEditor').hidden = true; FE.img = null;
  toast('사진을 지웠어요. 그린 얼굴로 돌아왔어요.');
});
function drawAvatar() { heroOnCanvas($('avatar'), 0); }
$('nameIn').addEventListener('input', (e) => { look.name = e.target.value.trim().slice(0, 8); saveLook(); });
$('dressBtn').addEventListener('click', () => { $('nameIn').value = look.name; renderDress(); $('faceClear').hidden = !look.face; $('faceEditor').hidden = true; $('dressOv').hidden = false; });
$('dRandom').addEventListener('click', () => { for (const k of Object.keys(LOOK_OPTS)) look[k] = Math.floor(Math.random() * LOOK_OPTS[k].length); saveLook(); renderDress(); });
$('dDone').addEventListener('click', () => {

  $('dressOv').hidden = true; drawAvatar(); placeAvatar(true);
});
function setSound(on) {
  soundOn = on; if (master) master.gain.value = on ? 1 : 0;
  $('soundBtn').textContent = on ? '소리 켬' : '소리 끔';
  $('soundBtn').setAttribute('aria-label', on ? '소리 끄기' : '소리 켜기');
}
$('soundBtn').addEventListener('click', () => { ensureAudio(); setSound(!soundOn); });

/* 미리보기와 지도 아바타 애니메이션 */
function tick() {
  if (!$('dressOv').hidden) heroOnCanvas($('bigPv'), performance.now() / 120);
  requestAnimationFrame(tick);
}
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!$('mapScreen').hidden && !walking) buildMap(); else placeAvatar(true); }, 150); });

})();
